  <style>
    /* ── Blogginnlegg-layout ── */
    .innlegg-wrapper {
      max-width: 740px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .tilbake-lenke {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: var(--farge-tekst-myk);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }

    .tilbake-lenke::before { content: '←'; }
    .tilbake-lenke:hover { color: var(--farge-aksent); }

    .innlegg-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .innlegg-tittel {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .innlegg-ingress {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--farge-tekst-myk);
      line-height: 1.65;
      border-left: 3px solid var(--farge-aksent);
      padding-left: 1.25rem;
      margin-bottom: 2rem;
    }

    .innlegg-bilde {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }

    .innlegg-bilde-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #e8ddd0 0%, #d4c4b0 100%);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--farge-tekst-myk);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .innlegg-brodtekst {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--farge-tekst);
    }

    .innlegg-brodtekst p { margin-bottom: 1.4rem; }

    .innlegg-brodtekst h2 {
      font-family: var(--font-sans);
      font-size: 1.2rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      color: var(--farge-tekst);
    }

    .innlegg-brodtekst ul,
    .innlegg-brodtekst ol {
      padding-left: 1.5rem;
      margin-bottom: 1.4rem;
    }

    .innlegg-brodtekst li { margin-bottom: 0.4rem; }

    .innlegg-tags {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--farge-kant);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .innlegg-tags-etikett {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--farge-tekst-myk);
      margin-right: 0.25rem;
    }

    .tag-merke {
      display: inline-block;
      background: var(--farge-overflate);
      border: 1px solid var(--farge-kant);
      border-radius: 2rem;
      padding: 0.2rem 0.75rem;
      font-size: 0.8rem;
      color: var(--farge-tekst-myk);
    }

    .feil-melding {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--farge-tekst-myk);
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

        ]
      },
      {

        "publisher": {

        }
      }
    ]
  }
  </script>

  <!-- Hjelpeskript: oppdaterer SEO-tagger dynamisk når innlegg er lastet -->
  <script>
    function oppdaterSEO(innlegg) {
      var baseUrl = 'https://skribleriforetaket.no/';
      var url = baseUrl + 'blogg-innlegg.html?id=' + innlegg.id;
      var tittel = innlegg.tittel + ' — Skribleriforetaket';
      var beskrivelse = innlegg.ingress || innlegg.beskrivelse || '';
      var bilde = innlegg.bilde
        ? baseUrl + innlegg.bilde
        : baseUrl + 'assets/images/portrett.webp';

      // Title og meta
      document.title = tittel;
      document.querySelector('meta[name="description"]').setAttribute('content', beskrivelse);
      document.querySelector('link[rel="canonical"]').setAttribute('href', url);

      // Open Graph
      document.querySelector('meta[property="og:url"]').setAttribute('content', url);
      document.querySelector('meta[property="og:title"]').setAttribute('content', tittel);
      document.querySelector('meta[property="og:description"]').setAttribute('content', beskrivelse);
      if (innlegg.bilde) {
        document.querySelector('meta[property="og:image"]').setAttribute('content', bilde);
      }

      // Twitter Card
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', tittel);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', beskrivelse);
      if (innlegg.bilde) {
        document.querySelector('meta[name="twitter:image"]').setAttribute('content', bilde);
      }

      // Schema.org BlogPosting
      var schema = {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://skribleriforetaket.no/#person",
            "name": "Rolf Sunde",
            "url": "https://skribleriforetaket.no",
            "jobTitle": "Frilansjournalist og skribent",
            "sameAs": ["https://www.linkedin.com/in/oversetter-rolf-sunde/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://skribleriforetaket.no/#website",
            "url": "https://skribleriforetaket.no",
            "name": "Skribleriforetaket"
          },
          {
            "@type": "BlogPosting",
            "@id": url + "#innlegg",
            "url": url,
            "headline": innlegg.tittel,
            "description": beskrivelse,
            "image": bilde,
            "datePublished": innlegg.dato || '',
            "author": { "@id": "https://skribleriforetaket.no/#person" },
            "isPartOf": { "@id": "https://skribleriforetaket.no/#website" }
          }
        ]
      };
      document.getElementById('schema-innlegg').textContent = JSON.stringify(schema);
    }
  </script>
