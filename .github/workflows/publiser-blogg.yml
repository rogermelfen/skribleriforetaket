name: Publiser blogginnlegg

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  publiser:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden fra GitHub
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bygg ny innhold.js
        run: node bygg-innhold.js

      - name: Last opp innhold.js til Hostinger via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          source: dist/innhold.js
          target: /home/u757637834/domains/skribleriforetaket.no/public_html/data/
